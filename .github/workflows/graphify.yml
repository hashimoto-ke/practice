name: Build and Deploy Graphify Knowledge Graph

on:
  push:
    branches: [ dev ]

# GitHub Pages デプロイに必要なパーミッションを追加
permissions:
  contents: write
  pages: write
  id-token: write

# 同時デプロイの衝突を防ぐ設定
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Graphify
        run: |
          uv tool install graphifyy

      - name: Run Graphify
        run: |
          graphify update . || graphify .

      # root URL (https://<user>.github.io/<repo>/) で直接グラフを開けるように index.html として複製
      - name: Prepare HTML for Pages
        run: |
          cp graphify-out/graph.html graphify-out/index.html

      # リポジトリへ成果物をコミット＆プッシュ
      - name: Commit and Push Graph
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add graphify-out/
          if git diff --cached --quiet; then
            echo "No changes in graphify artifacts to commit."
          else
            git commit -m "chore: update graphify knowledge graph [skip ci]"
            git push origin dev
          fi

      # GitHub Pages 用の成果物をアップロード
      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'graphify-out'

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-commit
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4